apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-gateway-hpa
  namespace: digitrans
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
