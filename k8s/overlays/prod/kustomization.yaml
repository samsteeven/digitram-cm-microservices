apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: digitrans

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: auth-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "256m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "512m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

configMapGenerator:
  - name: digitrans-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - SYNC_INTERVAL_MS=30000

secretGenerator:
  - name: digitrans-secrets
    behavior: replace
    literals:
      - DB_USER=digitrans_prod
      - DB_PASSWORD=from-aws-secrets-manager
      - JWT_SECRET=from-aws-secrets-manager
